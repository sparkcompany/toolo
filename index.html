<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Unit Converter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .converter-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: #4abc96;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef9f5;
            border-left: 5px solid #4abc96;
            border-radius: 4px;
            text-align: center;
        }

        .result-box p {
            font-size: 14px;
            color: #555;
        }

        .result-box span {
            font-size: 20px;
            font-weight: bold;
            color: #1e7e5e;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="converter-container">
    <h2>Unit Converter</h2>
    
    <!-- Input Value -->
    <div class="input-group">
        <label for="inputValue">Value Darz Karein:</label>
        <input type="number" id="inputValue" value="1" oninput="convert()">
    </div>

    <!-- Conversion Type -->
    <div class="input-group">
        <label for="conversionType">Kya convert karna hai?</label>
        <select id="conversionType" onchange="convert()">
            <option value="kgToLbs">Kilograms to Pounds (KG ➔ Lbs)</option>
            <option value="lbsToKg">Pounds to Kilograms (Lbs ➔ KG)</option>
            <option value="kmToMiles">Kilometers to Miles (KM ➔ Miles)</option>
            <option value="milesToKm">Miles to Kilometers (Miles ➔ KM)</option>
        </select>
    </div>

    <!-- Result Display -->
    <div class="result-box">
        <p>Aap ka Jawab:</p>
        <span id="resultValue">2.20 Lbs</span>
    </div>
</div>

<script>
    function convert() {
        // Elements ko get karna
        const inputValue = parseFloat(document.getElementById('inputValue').value);
        const conversionType = document.getElementById('conversionType').value;
        const resultValue = document.getElementById('resultValue');

        // Agar input khali ya invalid ho
        if (isNaN(inputValue)) {
            resultValue.innerText = "---";
            return;
        }

        let result = 0;
        let unit = "";

        // Conversion Logic
        switch (conversionType) {
            case "kgToLbs":
                result = inputValue * 2.20462;
                unit = "Lbs";
                break;
            case "lbsToKg":
                result = inputValue / 2.20462;
                unit = "KG";
                break;
            case "kmToMiles":
                result = inputValue * 0.621371;
                unit = "Miles";
                break;
            case "milesToKm":
                result = inputValue / 0.621371;
                unit = "KM";
                break;
        }

        // Result ko set karna (2 decimal points tak)
        resultValue.innerText = `${result.toFixed(2)} ${unit}`;
    }
</script>

</body>
</html>
